name: YadNegar Android Build

on:
  push:
    branches:
      - main
      - 'platform/**'
      - 'release/**'
    paths:
      - 'lib/**'
      - 'android/**'
      - 'assets/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/android-build.yml'
  pull_request:
    branches: [main]
    paths:
      - 'lib/**'
      - 'android/**'
      - 'assets/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: yadnegar-android-build-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  android-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          channel: stable
          cache: true

      - name: Restore licensed IRANSansX fonts when configured
        shell: bash
        env:
          IRANSANSX_FANUM_REGULAR_B64: ${{ secrets.IRANSANSX_FANUM_REGULAR_B64 }}
          IRANSANSX_FANUM_BOLD_B64: ${{ secrets.IRANSANSX_FANUM_BOLD_B64 }}
        run: |
          if [[ -n "${IRANSANSX_FANUM_REGULAR_B64:-}" && -n "${IRANSANSX_FANUM_BOLD_B64:-}" ]]; then
            mkdir -p assets/fonts
            printf '%s' "$IRANSANSX_FANUM_REGULAR_B64" | base64 --decode > assets/fonts/IRANSansXFaNum-Regular.ttf
            printf '%s' "$IRANSANSX_FANUM_BOLD_B64" | base64 --decode > assets/fonts/IRANSansXFaNum-Bold.ttf
            test -s assets/fonts/IRANSansXFaNum-Regular.ttf
            test -s assets/fonts/IRANSansXFaNum-Bold.ttf
            echo "Licensed IRANSansX fonts restored for this private build context."
          else
            echo "IRANSansX secrets are not configured; build will use the platform fallback font."
          fi

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Verify debug APK artifact
        run: test -s build/app/outputs/flutter-apk/app-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: yadnegar-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Build release-candidate APK
        run: flutter build apk --release

      - name: Verify release-candidate artifact and emit evidence
        shell: bash
        run: |
          set -euo pipefail
          apk="build/app/outputs/flutter-apk/app-release.apk"
          test -s "$apk"
          mkdir -p build/release-candidate
          sha256sum "$apk" | tee build/release-candidate/SHA256SUMS.txt
          bytes=$(stat -c %s "$apk")
          printf 'bytes=%s\n' "$bytes" | tee build/release-candidate/ARTIFACT_INFO.txt
          printf 'signing=debug-key-release-mode-not-production-signed\n' | tee -a build/release-candidate/ARTIFACT_INFO.txt

      - name: Upload release-candidate APK and evidence
        uses: actions/upload-artifact@v4
        with:
          name: yadnegar-android-release-candidate
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/release-candidate/SHA256SUMS.txt
            build/release-candidate/ARTIFACT_INFO.txt
          if-no-files-found: error
          retention-days: 14

  android-smoke-recovery:
    needs: android-build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download exact-run debug APK
        uses: actions/download-artifact@v4
        with:
          name: yadnegar-debug-apk
          path: build/smoke-apk

      - name: Verify downloaded debug APK
        run: test -s build/smoke-apk/app-debug.apk

      - name: Enable KVM group permissions
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run emulator startup and storage recovery proof
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            set -euo pipefail

            package="com.mobinpda.lab.yadnegar"
            activity=".MainActivity"
            evidence="build/android-smoke-evidence"
            mkdir -p "$evidence"

            capture_evidence() {
              set +e
              adb logcat -d > "$evidence/logcat.txt" 2>&1
              adb logcat -d -b crash > "$evidence/crash-buffer.txt" 2>&1
              adb shell dumpsys activity activities > "$evidence/activities.txt" 2>&1
              adb shell "run-as $package cat files/timeline.json" > "$evidence/recovered-timeline.json" 2>&1
              adb exec-out screencap -p > "$evidence/screenshot.png" 2>/dev/null
              set -e
            }
            trap capture_evidence EXIT

            adb install -r build/smoke-apk/app-debug.apk
            adb shell "run-as $package sh -c 'mkdir -p files'"

            seed='{"schemaVersion":2,"items":[{"id":"ci-smoke-1","type":"note","text":"ci-smoke-recovery","createdAt":"2026-08-27T00:00:00.000Z","occurredAt":null,"reminderAt":null}]}'
            printf '%s\n' "$seed" | adb shell "run-as $package sh -c 'cat > files/timeline.json'"
            adb shell "run-as $package sh -c 'test -s files/timeline.json'"

            adb logcat -c
            adb shell am force-stop "$package"
            adb shell am start -W -n "$package/$activity" | tee "$evidence/first-launch.txt"
            sleep 5
            adb shell pidof "$package" | tee "$evidence/first-pid.txt"
            adb shell dumpsys activity activities | grep -F "$package" > "$evidence/first-activity.txt"
            adb shell "run-as $package cat files/timeline.json" | grep -F 'ci-smoke-recovery' > "$evidence/first-storage-marker.txt"

            adb shell am force-stop "$package"
            adb shell "run-as $package sh -c 'rm -f files/timeline.json.bak files/timeline.json.tmp && mv files/timeline.json files/timeline.json.bak'"
            if adb shell "run-as $package sh -c 'test -e files/timeline.json'"; then
              echo "Primary storage unexpectedly remained before recovery." >&2
              exit 1
            fi
            adb shell "run-as $package sh -c 'test -s files/timeline.json.bak'"

            adb shell am start -W -n "$package/$activity" | tee "$evidence/recovery-launch.txt"
            sleep 5
            adb shell pidof "$package" | tee "$evidence/recovery-pid.txt"
            adb shell dumpsys activity activities | grep -F "$package" > "$evidence/recovery-activity.txt"
            adb shell "run-as $package sh -c 'test -s files/timeline.json'"
            adb shell "run-as $package cat files/timeline.json" | grep -F 'ci-smoke-recovery' > "$evidence/recovered-storage-marker.txt"

            if adb shell "run-as $package sh -c 'test -e files/timeline.json.bak'"; then
              echo "Backup staging file was not cleaned after recovery." >&2
              exit 1
            fi
            if adb shell "run-as $package sh -c 'test -e files/timeline.json.tmp'"; then
              echo "Temporary staging file was not cleaned after recovery." >&2
              exit 1
            fi

            adb logcat -d -b crash > "$evidence/crash-buffer-final.txt" 2>&1 || true
            if grep -Fq "$package" "$evidence/crash-buffer-final.txt"; then
              echo "Crash buffer contains a crash for YadNegar." >&2
              cat "$evidence/crash-buffer-final.txt" >&2
              exit 1
            fi

            printf 'startup=passed\nrecovery=passed\nstorage_marker=preserved\nstaging_cleanup=passed\n' | tee "$evidence/RESULT.txt"

      - name: Upload emulator smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yadnegar-android-smoke-recovery-evidence
          path: build/android-smoke-evidence/
          if-no-files-found: warn
          retention-days: 14
