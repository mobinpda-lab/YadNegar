name: YadNegar Android Build

on:
  push:
    branches:
      - main
      - 'platform/**'
    paths:
      - 'lib/**'
      - 'android/**'
      - 'assets/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/android-build.yml'
      - '.github/scripts/android-smoke-recovery.sh'
  pull_request:
    branches: [main]
    paths:
      - 'lib/**'
      - 'android/**'
      - 'assets/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/android-build.yml'
      - '.github/scripts/android-smoke-recovery.sh'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: yadnegar-android-build-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  android-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          channel: stable
          cache: true

      - name: Restore licensed IRANSansX fonts when configured
        shell: bash
        env:
          IRANSANSX_FANUM_REGULAR_B64: ${{ secrets.IRANSANSX_FANUM_REGULAR_B64 }}
          IRANSANSX_FANUM_BOLD_B64: ${{ secrets.IRANSANSX_FANUM_BOLD_B64 }}
        run: |
          if [[ -n "${IRANSANSX_FANUM_REGULAR_B64:-}" && -n "${IRANSANSX_FANUM_BOLD_B64:-}" ]]; then
            mkdir -p assets/fonts
            printf '%s' "$IRANSANSX_FANUM_REGULAR_B64" | base64 --decode > assets/fonts/IRANSansXFaNum-Regular.ttf
            printf '%s' "$IRANSANSX_FANUM_BOLD_B64" | base64 --decode > assets/fonts/IRANSansXFaNum-Bold.ttf
            test -s assets/fonts/IRANSansXFaNum-Regular.ttf
            test -s assets/fonts/IRANSansXFaNum-Bold.ttf
            echo "Licensed IRANSansX fonts restored for this private build context."
          else
            echo "IRANSansX secrets are not configured; build will use the platform fallback font."
          fi

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Verify debug APK artifact
        run: test -s build/app/outputs/flutter-apk/app-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: yadnegar-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Build release-candidate APK
        run: flutter build apk --release

      - name: Verify release-candidate artifact and emit evidence
        shell: bash
        run: |
          set -euo pipefail
          apk="build/app/outputs/flutter-apk/app-release.apk"
          test -s "$apk"
          mkdir -p build/release-candidate

          apk_sha=$(sha256sum "$apk" | awk '{print $1}')
          printf '%s  %s\n' "$apk_sha" "$apk" | tee build/release-candidate/SHA256SUMS.txt

          bytes=$(stat -c %s "$apk")
          version=$(awk '$1 == "version:" {print $2; exit}' pubspec.yaml)
          application_id=$(awk -F'"' '/applicationId = / {print $2; exit}' android/app/build.gradle.kts)
          signing='debug-key-release-mode-not-production-signed'

          test -n "$version"
          test -n "$application_id"
          test -n "${GITHUB_SHA:-}"

          {
            printf 'bytes=%s\n' "$bytes"
            printf 'signing=%s\n' "$signing"
          } | tee build/release-candidate/ARTIFACT_INFO.txt

          {
            printf 'format=yadnegar-release-manifest-v1\n'
            printf 'artifact=app-release.apk\n'
            printf 'version=%s\n' "$version"
            printf 'application_id=%s\n' "$application_id"
            printf 'source_sha=%s\n' "$GITHUB_SHA"
            printf 'apk_sha256=%s\n' "$apk_sha"
            printf 'bytes=%s\n' "$bytes"
            printf 'signing=%s\n' "$signing"
            printf 'release_class=release-mode-candidate-not-production-signed\n'
          } | tee build/release-candidate/RELEASE_MANIFEST.txt

      - name: Upload release-candidate APK and evidence
        uses: actions/upload-artifact@v4
        with:
          name: yadnegar-android-release-candidate
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/release-candidate/SHA256SUMS.txt
            build/release-candidate/ARTIFACT_INFO.txt
            build/release-candidate/RELEASE_MANIFEST.txt
          if-no-files-found: error
          retention-days: 14

  android-smoke-recovery:
    needs: android-build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download exact-run debug APK
        uses: actions/download-artifact@v4
        with:
          name: yadnegar-debug-apk
          path: build/smoke-apk

      - name: Verify downloaded debug APK
        run: test -s build/smoke-apk/app-debug.apk

      - name: Enable KVM group permissions
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run emulator startup and storage recovery proof
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash .github/scripts/android-smoke-recovery.sh

      - name: Upload emulator smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yadnegar-android-smoke-recovery-evidence
          path: build/android-smoke-evidence/
          if-no-files-found: warn
          retention-days: 14
