name: YadNegar Production Monitor

on:
  schedule:
    - cron: '37 * * * *'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: yadnegar-production-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify latest release provenance and open one incident on failure
        uses: actions/github-script@v8
        with:
          script: |
            const { owner, repo } = context.repo;
            const releases = await github.rest.repos.listReleases({ owner, repo, per_page: 10 });
            const latest = releases.data.find((release) => !release.draft && !release.prerelease);
            if (!latest) {
              core.info('No production release exists yet; monitoring is idle, not successful production evidence.');
              return;
            }
            const tag = await github.rest.git.getRef({ owner, repo, ref: `tags/${latest.tag_name}` });
            let releaseSha = tag.data.object.sha;
            if (tag.data.object.type === 'tag') {
              const annotated = await github.rest.git.getTag({ owner, repo, tag_sha: releaseSha });
              releaseSha = annotated.data.object.sha;
            }
            const commit = await github.rest.repos.getCommit({ owner, repo, ref: releaseSha });
            const assets = latest.assets || [];
            const hasApk = assets.some((asset) => asset.name.endsWith('.apk'));
            const hasManifest = assets.some((asset) => asset.name === 'PRODUCTION_RELEASE_MANIFEST.txt');
            const healthy = Boolean(commit.data.sha) && hasApk && hasManifest;
            if (healthy) {
              core.notice(`Latest release ${latest.tag_name} has immutable commit and required assets.`);
              return;
            }

            const marker = `<!-- yadnegar-production-incident:${latest.id} -->`;
            const query = `repo:${owner}/${repo} is:issue is:open in:body "${marker}"`;
            const found = await github.rest.search.issuesAndPullRequests({ q: query, per_page: 10 });
            if (!found.data.items.length) {
              await github.rest.issues.create({
                owner, repo,
                title: `Production incident: release ${latest.tag_name} provenance incomplete`,
                labels: ['factory:escalated', 'priority:release-blocker'],
                body: [
                  marker,
                  `Release: ${latest.html_url}`,
                  `Tag: \`${latest.tag_name}\``,
                  `Resolved commit: \`${releaseSha}\``,
                  `APK asset: ${hasApk ? 'present' : 'missing'}`,
                  `Manifest asset: ${hasManifest ? 'present' : 'missing'}`,
                  '',
                  'Automatic rollback is intentionally blocked until an earlier verified production release exists and rollback evidence is complete.',
                ].join('\n'),
              });
            }
            core.setFailed(`Production release ${latest.tag_name} provenance is incomplete.`);
