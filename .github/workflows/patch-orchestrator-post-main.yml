name: Patch Orchestrator Post Main
on:
  push:
    branches: [ci/orchestrator-post-main-dispatch]
    paths: [.github/workflows/patch-orchestrator-post-main.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ci/orchestrator-post-main-dispatch
      - name: Apply post-main proof barrier and remove self
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/production-orchestrator.yml')
          s=p.read_text()
          s=s.replace('permissions:\n  actions: read\n', 'permissions:\n  actions: write\n')
          anchor="""            const currentMain = await mainSha();\n            const pulls = await github.paginate(github.rest.pulls.list, {\n"""
          insert="""            const currentMain = await mainSha();\n\n            const mainRuns = await github.paginate(\n              github.rest.actions.listWorkflowRunsForRepo,\n              { owner, repo, head_sha: currentMain, per_page: 100 },\n            );\n            function latestMainProof(name) {\n              const matching = mainRuns\n                .filter((run) =>\n                  run.name === name &&\n                  run.head_sha === currentMain &&\n                  (run.event === 'push' || run.event === 'workflow_dispatch')\n                )\n                .sort((a, b) => b.id - a.id);\n              if (!matching.length) return null;\n              const run = matching[0];\n              return {\n                id: run.id,\n                status: run.status,\n                conclusion: run.conclusion,\n                ok: run.status === 'completed' && run.conclusion === 'success',\n              };\n            }\n            const mainCi = latestMainProof(gates.ci);\n            const mainAndroid = latestMainProof(gates.android);\n            if (!mainCi?.ok || !mainAndroid?.ok) {\n              core.info(\n                `main ${currentMain} post-main proof not complete: ` +\n                `CI=${mainCi?.conclusion ?? mainCi?.status ?? 'missing'} ` +\n                `Android=${mainAndroid?.conclusion ?? mainAndroid?.status ?? 'missing'}; queue paused`,\n              );\n              return;\n            }\n\n            const pulls = await github.paginate(github.rest.pulls.list, {\n"""
          if s.count(anchor)!=1: raise SystemExit('main proof anchor mismatch')
          s=s.replace(anchor, insert)
          anchor2="""              core.notice(`#${pr.number}: merged exact head ${headSha}; stopping after one merge.`);\n              return;\n"""
          insert2="""              const mergedMain = await mainSha();\n              if (mergedMain !== result.data.sha) {\n                core.setFailed(\n                  `#${pr.number}: merge succeeded as ${result.data.sha} but main resolved to ${mergedMain}; ` +\n                  'post-main dispatch aborted fail-closed',\n                );\n                return;\n              }\n\n              for (const workflow_id of ['flutter-ci.yml', 'android-build.yml']) {\n                await github.rest.actions.createWorkflowDispatch({\n                  owner,\n                  repo,\n                  workflow_id,\n                  ref: 'main',\n                });\n              }\n              core.notice(\n                `#${pr.number}: merged exact head ${headSha} as ${mergedMain}; ` +\n                'explicit post-main CI + Android proof dispatched; stopping after one merge.',\n              );\n              return;\n"""
          if s.count(anchor2)!=1: raise SystemExit('merge dispatch anchor mismatch')
          s=s.replace(anchor2, insert2)
          p.write_text(s)

          d=Path('docs/PRODUCTION_ORCHESTRATOR.md')
          t=d.read_text()
          t=t.replace(
            "- re-reads PR head, main SHA, mergeability and behind status immediately before merge\n- fails closed if anything changes during evaluation\n",
            "- re-reads PR head, main SHA, mergeability and behind status immediately before merge\n- requires current main to have successful post-main `YadNegar CI` + `YadNegar Android Build` proof before advancing the next PR\n- explicitly dispatches existing CI and Android workflows on the new `main` after a token-driven merge\n- fails closed if anything changes during evaluation\n",
          )
          t=t.replace(
            "After an orchestrated merge, the repository's existing push-triggered CI and Android workflows provide post-main proof on the new main SHA. The orchestrator does not claim a production release or store publication.\n",
            "After an orchestrated merge, the orchestrator explicitly dispatches the existing CI and Android workflows on `main`, because GitHub may suppress recursive `push` workflow triggers for merges performed with `GITHUB_TOKEN`. The next PR cannot advance until those post-main runs are green. No second CI foundation is introduced. The orchestrator does not claim a production release or store publication.\n",
          )
          d.write_text(t)
          PY
          rm .github/workflows/patch-orchestrator-post-main.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/production-orchestrator.yml docs/PRODUCTION_ORCHESTRATOR.md .github/workflows/patch-orchestrator-post-main.yml
          git commit -m 'fix(ci): enforce explicit post-main proof dispatch'
          git push origin HEAD:ci/orchestrator-post-main-dispatch