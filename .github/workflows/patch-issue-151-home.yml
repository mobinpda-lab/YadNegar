name: Patch Issue 151 Home

on:
  push:
    branches:
      - feat/issue-151-home-bismillah-swipe-v6

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/issue-151-home-bismillah-swipe-v6
          fetch-depth: 0
      - name: Apply exact Home patch
        run: python3 -c "import base64;exec(base64.b64decode(''))"
      - name: Commit exact product patch and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/features/timeline/presentation/tracked_subject_home.dart .github/workflows/patch-issue-151-home.yml
          git commit -m "feat(home): add Bismillah and safe FollowUp swipe"
          git push origin HEAD:feat/issue-151-home-bismillah-swipe-v6
