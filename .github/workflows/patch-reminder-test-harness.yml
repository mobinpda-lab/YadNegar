name: Patch Reminder Test Harness
on:
  push:
    branches: [feat/tracked-reminder-integration]
    paths: [.github/workflows/patch-reminder-test-harness.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/tracked-reminder-integration
      - name: Apply compatibility patch and remove self
        run: |
          python3 - <<'PY'
          from pathlib import Path
          files = [
            Path('lib/features/timeline/presentation/tracked_subject_home.dart'),
            Path('lib/features/timeline/presentation/tracked_subject_detail.dart'),
          ]
          for p in files:
            s = p.read_text()
            s = s.replace('    required this.reminderScheduler,', '    this.reminderScheduler,')
            s = s.replace('  final TimelineReminderScheduler reminderScheduler;', '  final TimelineReminderScheduler? reminderScheduler;')
            s = s.replace('await widget.reminderScheduler.cancel(', 'await widget.reminderScheduler?.cancel(')
            s = s.replace('await widget.reminderScheduler.schedule(', 'await widget.reminderScheduler?.schedule(')
            p.write_text(s)
          PY
          rm .github/workflows/patch-reminder-test-harness.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib/features/timeline/presentation/tracked_subject_home.dart lib/features/timeline/presentation/tracked_subject_detail.dart .github/workflows/patch-reminder-test-harness.yml
          git commit -m 'fix(reminder): keep test harness scheduler optional'
          git push origin HEAD:feat/tracked-reminder-integration