name: Patch Next Action v7

on:
  push:
    branches:
      - feat/today-next-action-v7

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/today-next-action-v7
          fetch-depth: 0
      - name: Apply exact schema v7 patch
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('lib/features/timeline/data/json_file_timeline_repository.dart')
          text = path.read_text()

          replacements = [
              (
                  "  static const int schemaVersion = 6;\n  static const int descriptionSchemaVersion = 5;\n",
                  "  static const int schemaVersion = 7;\n  static const int projectSchemaVersion = 6;\n  static const int descriptionSchemaVersion = 5;\n",
              ),
              (
                  "    if (version != schemaVersion &&\n        version != descriptionSchemaVersion &&\n",
                  "    if (version != schemaVersion &&\n        version != projectSchemaVersion &&\n        version != descriptionSchemaVersion &&\n",
              ),
              (
                  "    if (version >= schemaVersion) {\n      final rawProjects = decoded['projects'];\n",
                  "    if (version >= projectSchemaVersion) {\n      final rawProjects = decoded['projects'];\n",
              ),
              (
                  "    final projectId = sourceSchemaVersion >= schemaVersion\n        ? _optionalString(value, 'projectId')\n        : null;\n    final parentId = sourceSchemaVersion >= followUpSchemaVersion\n",
                  "    final projectId = sourceSchemaVersion >= projectSchemaVersion\n        ? _optionalString(value, 'projectId')\n        : null;\n    final nextActionAt = sourceSchemaVersion >= schemaVersion\n        ? _optionalDateTime(value, 'nextActionAt')\n        : null;\n    final parentId = sourceSchemaVersion >= followUpSchemaVersion\n",
              ),
              (
                  "    if (parentId != null && projectId != null) {\n      throw const FormatException('FollowUps cannot own projectId.');\n    }\n\n    return TimelineItem(\n",
                  "    if (parentId != null && projectId != null) {\n      throw const FormatException('FollowUps cannot own projectId.');\n    }\n    if (parentId != null && nextActionAt != null) {\n      throw const FormatException('FollowUps cannot own nextActionAt.');\n    }\n\n    return TimelineItem(\n",
              ),
              (
                  "      description: description,\n      projectId: projectId,\n      createdAt: createdAt,\n",
                  "      description: description,\n      projectId: projectId,\n      nextActionAt: nextActionAt,\n      createdAt: createdAt,\n",
              ),
              (
                  "      'description': item.description,\n      'projectId': item.isTrackedSubject ? item.projectId : null,\n      'createdAt': item.createdAt.toIso8601String(),\n",
                  "      'description': item.description,\n      'projectId': item.isTrackedSubject ? item.projectId : null,\n      'nextActionAt': item.isTrackedSubject ? item.nextActionAt?.toIso8601String() : null,\n      'createdAt': item.createdAt.toIso8601String(),\n",
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'anchor mismatch ({count}): {old[:80]!r}')
              text = text.replace(old, new, 1)

          path.write_text(text)
          Path('.github/workflows/patch-next-action-v7.yml').unlink()
          PY
      - name: Commit scoped schema patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/features/timeline/data/json_file_timeline_repository.dart .github/workflows/patch-next-action-v7.yml
          git commit -m "feat(today): persist root next action in schema v7"
          git push origin HEAD:feat/today-next-action-v7
