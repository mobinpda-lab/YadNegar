name: Apply tracked-task backup icon patch

on:
  push:
    branches:
      - product/tracked-subject-backup-icon

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: product/tracked-subject-backup-icon
      - name: Apply deterministic one-line patch
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('lib/features/timeline/presentation/tracked_subject_home.dart')
          source = path.read_text()
          old = 'icon: const Icon(Icons.notifications_none_rounded, color: _primary),'
          new = 'icon: const Icon(Icons.backup_outlined, color: _primary),'
          if source.count(old) != 1:
              raise SystemExit(f'expected exactly one old backup icon, found {source.count(old)}')
          path.write_text(source.replace(old, new, 1))
          Path('.github/workflows/apply-tracked-subject-backup-icon.yml').unlink()
          PY
      - name: Commit final branch state
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "ui(home): use backup icon for backup action"
          git push origin HEAD:product/tracked-subject-backup-icon
