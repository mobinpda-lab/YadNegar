name: YadNegar Autonomous Queue

on:
  issues:
    types: [opened, reopened, labeled, unlabeled]
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  actions: write

concurrency:
  group: yadnegar-autonomous-queue
  cancel-in-progress: false

jobs:
  route:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Lease and dispatch one eligible task
        uses: actions/github-script@v8
        with:
          script: |
            const { owner, repo } = context.repo;
            const definitions = [
              ['factory:ready', '0E8A16', 'Task is eligible for autonomous routing.'],
              ['factory:leased', '1D76DB', 'Task currently has one autonomous worker lease.'],
              ['factory:in-progress', '5319E7', 'Autonomous worker execution is in progress.'],
              ['factory:blocked', 'B60205', 'Task is blocked and must not be routed.'],
              ['factory:escalated', 'D93F0B', 'Task requires human or infrastructure intervention.'],
              ['priority:release-blocker', 'B60205', 'Highest priority release blocker.'],
              ['priority:core', 'D93F0B', 'Core product priority.'],
              ['priority:automation', '1D76DB', 'Automation priority.'],
              ['priority:feature', 'C2E0C6', 'Feature priority.'],
            ];
            for (const [name, color, description] of definitions) {
              try {
                await github.rest.issues.getLabel({ owner, repo, name });
              } catch (error) {
                if (error.status !== 404) throw error;
                await github.rest.issues.createLabel({ owner, repo, name, color, description });
              }
            }

            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', labels: 'factory:ready', per_page: 100,
            });
            const blocked = new Set([
              'factory:blocked', 'factory:escalated', 'orchestrator:hold',
              'orchestrator:manual', 'do-not-merge',
            ]);
            const weight = (labels) => {
              if (labels.has('priority:release-blocker')) return 0;
              if (labels.has('priority:core')) return 1;
              if (labels.has('priority:automation')) return 2;
              return 3;
            };
            const eligible = issues
              .filter((issue) => !issue.pull_request)
              .map((issue) => ({
                issue,
                labels: new Set((issue.labels || []).map((label) => typeof label === 'string' ? label : label.name)),
              }))
              .filter(({ labels }) => !labels.has('factory:leased'))
              .filter(({ labels }) => ![...blocked].some((label) => labels.has(label)))
              .sort((a, b) => weight(a.labels) - weight(b.labels) || a.issue.number - b.issue.number);

            if (!eligible.length) {
              core.info('No eligible autonomous task found.');
              return;
            }

            const main = await github.rest.repos.getBranch({ owner, repo, branch: 'main' });
            const task = eligible[0].issue;
            await github.rest.issues.addLabels({
              owner, repo, issue_number: task.number,
              labels: ['factory:leased', 'factory:in-progress'],
            });
            await github.rest.issues.createComment({
              owner, repo, issue_number: task.number,
              body: `<!-- yadnegar-worker-lease -->\nAutonomous Queue leased this task at main \`${main.data.commit.sha}\`. A single worker gateway dispatch follows.`,
            });

            try {
              await github.rest.actions.createWorkflowDispatch({
                owner, repo,
                workflow_id: 'autonomous-code-worker.yml',
                ref: 'main',
                inputs: {
                  issue_number: String(task.number),
                  expected_main_sha: main.data.commit.sha,
                },
              });
              core.notice(`Dispatched issue #${task.number} against ${main.data.commit.sha}`);
            } catch (error) {
              await github.rest.issues.removeLabel({ owner, repo, issue_number: task.number, name: 'factory:leased' }).catch(() => {});
              await github.rest.issues.addLabels({ owner, repo, issue_number: task.number, labels: ['factory:blocked'] });
              await github.rest.issues.createComment({
                owner, repo, issue_number: task.number,
                body: `Worker dispatch failed closed: ${error.message}`,
              });
              throw error;
            }
