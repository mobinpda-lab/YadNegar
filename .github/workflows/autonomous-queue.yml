name: YadNegar Autonomous Queue

on:
  issues:
    types: [opened, reopened, labeled, unlabeled]
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  actions: write

concurrency:
  group: yadnegar-autonomous-queue
  cancel-in-progress: false

jobs:
  route:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Lease and dispatch one eligible task
        uses: actions/github-script@v8
        with:
          script: |
            const { owner, repo } = context.repo;
            const definitions = [
              ['factory:ready', '0E8A16', 'Task is eligible for autonomous routing.'],
              ['factory:leased', '1D76DB', 'Task currently has one autonomous worker lease.'],
              ['factory:in-progress', '5319E7', 'Autonomous execution is in progress.'],
              ['factory:manual-execution', 'FBCA04', 'Legacy manual handoff state; autonomous worker must not use it.'],
              ['factory:blocked', 'B60205', 'Task is blocked and must not be routed.'],
              ['factory:escalated', 'D93F0B', 'Task requires human or infrastructure intervention.'],
              ['priority:release-blocker', 'B60205', 'Highest priority release blocker.'],
              ['priority:core', 'D93F0B', 'Core product priority.'],
              ['priority:automation', '1D76DB', 'Automation priority.'],
              ['priority:feature', 'C2E0C6', 'Feature priority.'],
            ];
            for (const [name, color, description] of definitions) {
              try { await github.rest.issues.getLabel({ owner, repo, name }); }
              catch (error) {
                if (error.status !== 404) throw error;
                await github.rest.issues.createLabel({ owner, repo, name, color, description });
              }
            }
            const issues = await github.paginate(github.rest.issues.listForRepo, { owner, repo, state: 'open', labels: 'factory:ready', per_page: 100 });
            const blocked = new Set(['factory:blocked','factory:escalated','factory:manual-execution','orchestrator:hold','orchestrator:manual','do-not-merge']);
            const weight = (labels) => labels.has('priority:release-blocker') ? 0 : labels.has('priority:core') ? 1 : labels.has('priority:automation') ? 2 : labels.has('priority:feature') ? 3 : 4;
            const eligible = issues.filter(i => !i.pull_request).map(issue => ({ issue, labels: new Set((issue.labels || []).map(l => typeof l === 'string' ? l : l.name)) }))
              .filter(({ labels }) => !labels.has('factory:leased') && ![...blocked].some(x => labels.has(x)))
              .sort((a,b) => weight(a.labels) - weight(b.labels) || a.issue.number - b.issue.number);
            if (!eligible.length) { core.info('No eligible autonomous task found.'); return; }
            const main = await github.rest.repos.getBranch({ owner, repo, branch: 'main' });
            const task = eligible[0].issue;
            const mainSha = main.data.commit.sha;
            await github.rest.issues.addLabels({ owner, repo, issue_number: task.number, labels: ['factory:leased','factory:in-progress'] });
            await github.rest.issues.createComment({ owner, repo, issue_number: task.number, body: `<!-- yadnegar-worker-lease -->\nCode Worker lease created at exact main \`${mainSha}\`.` });
            try {
              await github.rest.actions.createWorkflowDispatch({ owner, repo, workflow_id: 'autonomous-code-worker.yml', ref: 'main', inputs: { issue_number: String(task.number), expected_main_sha: mainSha } });
              core.notice(`Dispatched Code Worker for issue #${task.number} at ${mainSha}`);
            } catch (error) {
              await github.rest.issues.removeLabel({ owner, repo, issue_number: task.number, name: 'factory:leased' }).catch(() => {});
              await github.rest.issues.removeLabel({ owner, repo, issue_number: task.number, name: 'factory:in-progress' }).catch(() => {});
              await github.rest.issues.addLabels({ owner, repo, issue_number: task.number, labels: ['factory:blocked'] });
              await github.rest.issues.createComment({ owner, repo, issue_number: task.number, body: `Code Worker dispatch failed closed: ${error.message}` });
              throw error;
            }
