name: YadNegar Autonomous Task Handoff

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'GitHub issue number to execute'
        required: true
        type: string
      expected_main_sha:
        description: 'Main SHA leased by queue'
        required: true
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: yadnegar-task-handoff-${{ inputs.issue_number }}
  cancel-in-progress: false

jobs:
  handoff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate lease and hand off for direct project execution
        uses: actions/github-script@v8
        with:
          script: |
            const { owner, repo } = context.repo;
            const issueNumber = Number('${{ inputs.issue_number }}');
            const expectedMain = '${{ inputs.expected_main_sha }}';

            if (!Number.isInteger(issueNumber) || issueNumber <= 0) {
              core.setFailed('Invalid issue number.');
              return;
            }

            const main = await github.rest.repos.getBranch({ owner, repo, branch: 'main' });
            if (main.data.commit.sha !== expectedMain) {
              await github.rest.issues.removeLabel({ owner, repo, issue_number: issueNumber, name: 'factory:leased' }).catch(() => {});
              await github.rest.issues.removeLabel({ owner, repo, issue_number: issueNumber, name: 'factory:in-progress' }).catch(() => {});
              await github.rest.issues.createComment({
                owner, repo, issue_number: issueNumber,
                body: `Task handoff invalidated because main moved from \`${expectedMain}\` to \`${main.data.commit.sha}\`. Task will be re-queued.`,
              });
              return;
            }

            const issue = (await github.rest.issues.get({ owner, repo, issue_number: issueNumber })).data;
            const labels = new Set((issue.labels || []).map((label) => label.name));
            if (!labels.has('factory:leased') || !labels.has('factory:ready')) {
              core.setFailed('Issue does not hold a valid autonomous lease.');
              return;
            }

            await github.rest.issues.removeLabel({ owner, repo, issue_number: issueNumber, name: 'factory:leased' }).catch(() => {});
            await github.rest.issues.removeLabel({ owner, repo, issue_number: issueNumber, name: 'factory:in-progress' }).catch(() => {});
            await github.rest.issues.addLabels({ owner, repo, issue_number: issueNumber, labels: ['factory:manual-execution'] });
            await github.rest.issues.createComment({
              owner, repo, issue_number: issueNumber,
              body: `Task accepted by the YadNegar factory at exact main \`${expectedMain}\`. External Codex/worker execution is intentionally not required. Code changes must proceed through the normal issue-scoped branch → commit → PR → CI → gate → Production Orchestrator path. No merge or gate was bypassed.`,
            });
            core.notice(`Issue #${issueNumber} handed off for direct project execution.`);
