name: yadnegar
description: Persian RTL personal memory assistant and knowledge organizer.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
  fonts:
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/vazirmatn/Vazirmatn-UI-FD-Regular.ttf
          weight: 400
        - asset: assets/fonts/vazirmatn/Vazirmatn-UI-FD-Medium.ttf
          weight: 500
        - asset: assets/fonts/vazirmatn/Vazirmatn-UI-FD-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/vazirmatn/Vazirmatn-UI-FD-Bold.ttf
          weight: 700
