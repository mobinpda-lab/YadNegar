# CI bootstrap note: touching pubspec intentionally exercises the full Android post-main proof path.
name: yadnegar
description: Persian RTL personal memory assistant and knowledge organizer.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  path_provider: ^2.1.5
  share_plus: 10.1.4
  file_picker: 8.3.7
  flutter_local_notifications: 19.5.0
  flutter_timezone: 5.1.0
  timezone: 0.10.1
  pdf: ^3.12.0
  printing: ^5.14.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
  fonts:
    - family: Vazirharf
      fonts:
        - asset: assets/fonts/vazirharf/fonts/ttf/Vazirharf-Regular.ttf
          weight: 400
        - asset: assets/fonts/vazirharf/fonts/ttf/Vazirharf-Medium.ttf
          weight: 500
        - asset: assets/fonts/vazirharf/fonts/ttf/Vazirharf-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/vazirharf/fonts/ttf/Vazirharf-Bold.ttf
          weight: 700
        - asset: assets/fonts/vazirharf/fonts/ttf/Vazirharf-Black.ttf
          weight: 900
